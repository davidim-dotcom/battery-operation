<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="운용체험">
<meta name="theme-color" content="#0A1820">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>축전지 운용 체험</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Sans+JP:wght@400;600;700&display=swap">
<style>
/* Layout: one dusk-lit control room. Lobby (hero + household + week) → live console (house scene, power flow, price, battery, four mode keys, day strip) → result sheet.
   Single dark look by choice: the game lives at dusk, when the evening peak hits. */
:root{
  color-scheme:dark;
  --bg:#0A1820; --panel:#10242E; --panel2:#153140; --ink:#E8F1F4; --muted:#8FA8B3; --line:#244150;
  --sun:#F5B841; --teal:#3CC6B4; --grid:#7FA2FF; --sell:#FF8A3D; --bad:#FF5A5F; --good:#5BD69A;
  --f-display:"Chakra Petch","IBM Plex Sans KR","IBM Plex Sans JP",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","IBM Plex Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--sun);border-color:var(--sun);color:#1B1305;font-weight:700}
.btn.ghost{background:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}

/* lobby */
.hero{position:relative;border-radius:12px;overflow:hidden;min-height:260px;display:flex;align-items:flex-end;background:#1a1208 center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,24,32,.05) 0%,rgba(10,24,32,.55) 55%,rgba(10,24,32,.96) 100%)}
.hero .in{position:relative;z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.5);padding:24px;display:flex;flex-direction:column;gap:8px;max-width:640px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6vw,52px);line-height:1.02;margin:0;letter-spacing:.01em;text-wrap:balance}
.hero p{margin:0;color:#D6E4EA;max-width:56ch}
.lobby{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-top:14px}
.sec{padding:16px;display:flex;flex-direction:column;gap:12px}
.sec h2{margin:0;font-size:15px;font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#06231E;font-weight:700}
.pat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:center}
.pat .ph{border-radius:8px;aspect-ratio:16/9;background:center/cover no-repeat;max-width:100%}
.pat p{margin:0;color:var(--muted)}
.pat svg{width:100%;height:auto;display:block}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.modesw{margin-top:14px;width:fit-content}
.spec2{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}.spec2 dt{color:var(--muted);font-size:12.5px}.spec2 dd{margin:0;font-family:var(--f-mono)}
.bcards{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:12px}
.bcard{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bcard select{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit;font-size:12px}
.bcard .bt{font-size:12px;color:var(--muted)}
.bres{font-size:11.5px;min-height:30px;font-family:var(--f-mono);line-height:1.35}
.bcard.flip{animation:flip .5s}.bcard.ok .bres{color:var(--good)}.bcard.ng .bres{color:var(--bad)}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.bbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}#b-exp{margin-left:auto;color:var(--sun)}
@media(max-width:860px){.bcards{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:480px){.bcards{grid-template-columns:minmax(0,1fr);gap:4px;margin-top:8px}#b-exp{width:100%;margin-left:0}.bres{min-height:0}.bres:empty{display:none}.bcard{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.25fr);align-items:center;gap:6px;padding:4px 8px;border-top:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px}.bcard .bt{font-size:11px}.bcard select{padding:4px 2px;font-size:12px}.bcard .bres{grid-column:1/-1;font-size:11.5px;padding-left:2px}#b-chart{min-width:0}.bbar{margin-top:10px;gap:6px}.bbar .btn{padding:7px 10px;font-size:13px}#b-submit{width:100%;padding:11px;font-size:15px}}
.daily{border-color:var(--sun);background:linear-gradient(135deg,color-mix(in srgb,var(--sun) 10%,var(--panel)),var(--panel))}
.day{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.day .d{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1}
.day .w{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .s{font-family:var(--f-mono);color:var(--sun);font-size:12px;letter-spacing:.1em}
.day[aria-current="true"]{border-color:var(--sun);box-shadow:inset 0 -3px 0 var(--sun)}
.sys{padding:14px;display:flex;flex-direction:column;gap:12px}
.sys svg{width:100%;height:auto;display:block;background:var(--panel2);border-radius:8px}
.sys dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.sys dt{color:var(--muted);font-size:12.5px}.sys dd{margin:0;font-family:var(--f-mono)}
.howto{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.howto b{color:var(--ink)}

/* play */
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1}
.play{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.lcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.scene{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:16/10;background:#000 center/cover no-repeat;max-width:100%}
.scene .sky{position:absolute;inset:0;mix-blend-mode:multiply;transition:background .6s}
.scene .glow{position:absolute;inset:0;background:radial-gradient(40% 40% at 85% 25%,rgba(255,190,90,.55),transparent 70%);opacity:0;transition:opacity .6s;mix-blend-mode:screen}
.scene .cloud{position:absolute;inset:0;background:linear-gradient(180deg,rgba(150,160,170,.75),rgba(120,130,140,.25));opacity:0;transition:opacity .8s}
.scene .orb{position:absolute;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);transition:left .3s linear,top .3s linear}
.scene svg.stage{position:absolute;inset:0;width:100%;height:100%}
.scene .badge{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;gap:6px;white-space:nowrap}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border-radius:999px;background:rgba(10,24,32,.78);border:1px solid rgba(255,255,255,.15)}
.chip.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.outage{position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--bad);background:rgba(120,10,20,.22);opacity:0;pointer-events:none;transition:opacity .4s}
.outage.on{opacity:1}
.float{position:absolute;font-family:var(--f-mono);font-weight:600;pointer-events:none;animation:up 1.2s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.6)}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-40px);opacity:0}}
.dash{stroke-dasharray:6 10;animation:dash linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.stats{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{min-width:0}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05}
.stat .u{font-size:12px;color:var(--muted)}
.bar{height:6px;background:#1C3A48;border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.mode{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:76px}
.mode .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.mode .n{font-weight:700;font-size:15px}
.mode .x{font-size:12px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c),0 0 18px -6px var(--c);background:color-mix(in srgb,var(--c) 16%,var(--panel2))}
.advice{padding:12px 14px;font-size:13.5px;min-height:52px;display:flex;gap:10px;align-items:flex-start}
.advice .dot{width:8px;height:8px;border-radius:50%;background:var(--sun);margin-top:7px;flex:none}
.strip{padding:10px 12px}
.strip svg{width:100%;height:auto;display:block}
.alert{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--bad);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;transition:transform .35s;max-width:min(92vw,560px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.alert.show{transform:translate(-50%,0)}
.alert.amber{background:var(--sun);color:#1B1305}

/* result */
.modal{position:fixed;inset:0;background:rgba(4,10,14,.72);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px;overflow:auto}
.sheet{width:min(760px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-height:100%;overflow-y:auto}
.sheet .top{position:relative;padding:20px;background:center/cover no-repeat;min-height:150px;display:flex;align-items:flex-end;gap:18px}
.sheet .top::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,36,46,.96) 0%,rgba(16,36,46,.82) 45%,rgba(16,36,46,.35) 100%)}
.sheet .top>*{position:relative}
.rank{font-family:var(--f-display);font-weight:700;font-size:76px;line-height:.9;color:var(--sun)}
.stars{font-size:26px;letter-spacing:4px;color:var(--sun)}
.stars .off{color:#3A5562}
.sheet .body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
table.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cmp td,.cmp th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.cmp td:first-child,.cmp th:first-child{text-align:left}
.cmp th{font-weight:600;color:var(--muted);font-size:12.5px}
.cmp tr.me td{color:var(--sun);font-weight:700}
.missions{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.missions li{display:flex;gap:8px;align-items:baseline}
.missions .m{color:var(--good);font-weight:700}.missions .x{color:var(--bad);font-weight:700}
.lesson{border-left:3px solid var(--sun);padding:2px 0 2px 12px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.foot{margin-top:18px;font-size:12px;color:var(--muted);max-width:90ch}
body.playing .foot{display:none}
body.playing:has(#bess:not([hidden])){padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (max-width:860px){.lobby,.play{grid-template-columns:minmax(0,1fr)}.days{grid-template-columns:repeat(3,minmax(0,1fr))}.pat{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  .hero{min-height:0}.hero .in{padding:16px}.hero p{font-size:13px}.pat .ph{display:none}.lobby{margin-top:10px;gap:10px}.sec{padding:14px;gap:10px}
  body.playing .topbar{display:none}
  body.playing{padding-block:10px calc(92px + env(safe-area-inset-bottom,0px))}
  .ptop{margin-bottom:8px;gap:6px}.ptop .eyebrow{font-size:10px;letter-spacing:.06em}.clock{font-size:24px}
  .ptop .btn{padding:6px 10px}.seg button{padding:5px 9px}#snd{display:none}
  .play{gap:8px}.lcol,.side{display:contents}
  .scene{order:1}.stats{order:2}.strip{order:3}.advice{order:4}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr));padding:10px;gap:6px}
  .stat .v{font-size:17px}.stat .u{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat .sub{display:none}
  .modes{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:0;border-width:1px 0 0;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .mode{min-height:60px;padding:8px 6px;align-items:center;text-align:center}.mode .x{display:none}.mode .k{width:100%}.mode .n{font-size:13px}
  .advice{padding:8px 12px;font-size:12.5px;min-height:0}.strip{padding:6px 8px}
}
@media (max-width:420px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.dash{animation:none}.float{animation:none;opacity:0}}
</style>

</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="eyebrow" id="eyebrow">PV 8 kW · PCS 5.9 kW · 30 min × 48</span>
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-ko" type="button" aria-pressed="true">한국어</button>
      <button id="lang-ja" type="button" aria-pressed="false">日本語</button>
    </div>
  </div>

  <section id="lobby">
    <div class="hero" id="hero">
      <div class="in">
        <span class="eyebrow" id="l-kicker"></span>
        <h1 id="l-title"></h1>
        <p id="l-lead"></p>
      </div>
    </div>
    <div class="seg modesw" role="group" aria-label="mode"><button id="m-home" type="button" aria-pressed="true"></button><button id="m-bess" type="button" aria-pressed="false"></button></div>
    <div class="lobby" id="bess-lobby" hidden>
      <div class="card sec"><h2 id="bl-title" style="font-size:18px"></h2><p id="bl-desc" style="margin:0;color:var(--muted)"></p><h2 id="bl-area"></h2><div class="tabs" role="tablist" id="bl-areas"></div><p id="bl-note" style="margin:0;color:var(--muted);font-size:13px"></p><div><button class="btn primary" id="b-start" type="button"></button></div><p class="mono" id="bl-avg" style="margin:0;color:var(--teal);font-size:12.5px"></p></div>
      <div class="card sec"><dl id="bl-spec" class="spec2"></dl><ol class="howto" id="bl-how"></ol></div>
    </div>
    <div class="lobby" id="home-lobby">
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <div class="card sec daily">
          <div><span class="eyebrow" id="d-no"></span><h2 id="d-title" style="font-size:18px"></h2></div>
          <p id="d-desc" style="margin:0;color:var(--muted)"></p>
          <div class="row" style="justify-content:flex-start;align-items:center"><button class="btn primary" id="d-start" type="button"></button><span class="mono" id="d-rec" style="color:var(--sun)"></span></div>
        </div>
        <div class="card sec">
          <h2 id="l-free" style="font-size:18px"></h2>
          <h2 id="l-pat"></h2>
          <div class="tabs" role="tablist" id="pat-tabs"></div>
          <div class="pat"><div class="ph" id="pat-ph"></div><div><p id="pat-desc"></p><svg id="pat-svg" viewBox="0 0 300 92" role="img" aria-label="load"></svg></div></div>
          <h2 id="l-week"></h2>
          <div class="days" id="days"></div>
          <p id="day-desc" style="margin:0;color:var(--muted)"></p>
          <div><button class="btn primary" id="start" type="button"></button></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <div class="card sys"><svg id="sys-svg" viewBox="0 0 480 300" role="img" aria-label="system"></svg><dl id="sys-dl"></dl></div>
        <div class="card sec"><h2 id="l-how"></h2><ol class="howto" id="howto"></ol><p class="mono" id="l-avg" style="margin:0;color:var(--teal);font-size:12.5px"></p></div>
      </div>
    </div>
  </section>

  <section id="play" hidden>
    <div class="ptop">
      <div class="hud">
        <span class="clock mono" id="clock">00:00</span>
        <div><div class="eyebrow" id="p-day"></div><div style="font-weight:700" id="p-pat"></div></div>
      </div>
      <div class="hud">
        <div class="seg" role="group" aria-label="speed">
          <button id="sp-0" type="button" aria-pressed="false">II</button>
          <button id="sp-1" type="button" aria-pressed="true">1×</button>
          <button id="sp-2" type="button" aria-pressed="false">2×</button>
          <button id="sp-4" type="button" aria-pressed="false">4×</button>
        </div>
        <button class="btn ghost" id="snd" type="button"></button>
        <button class="btn ghost" id="quit" type="button"></button>
      </div>
    </div>
    <div class="play">
      <div class="lcol">
        <div class="scene" id="scene">
          <div class="sky" id="sky"></div><div class="glow" id="glow"></div><div class="cloud" id="cloud"></div>
          <div class="orb" id="orb"></div>
          <svg class="stage" id="stage" viewBox="0 0 480 300" role="img" aria-label="power flow"></svg>
          <div class="outage" id="outage"></div>
          <div class="badge" id="badges"></div>
        </div>
        <div class="card strip"><svg id="strip" viewBox="0 0 640 150" role="img" aria-label="day strip"></svg></div>
      </div>
      <div class="side">
        <div class="card stats">
          <div class="stat"><div class="u" id="u-price"></div><div class="v mono" id="v-price">–</div><div class="u sub" id="v-pnext"></div></div>
          <div class="stat"><div class="u" id="u-save"></div><div class="v mono" id="v-save">¥0</div><div class="u sub" id="v-cost"></div></div>
          <div class="stat"><div class="u" id="u-soc"></div><div class="v mono" id="v-soc">–</div><div class="bar"><i id="soc-fill"></i></div></div>
          <div class="stat"><div class="u" id="u-clip"></div><div class="v mono" id="v-clip">0.0</div><div class="u sub">kWh</div></div>
        </div>
        <div class="card modes" id="modes"></div>
        <div class="card advice"><span class="dot"></span><span id="advice"></span></div>
      </div>
    </div>
  </section>
  <section id="bess" hidden>
    <div class="ptop"><div class="hud"><span class="eyebrow" id="b-hdr" style="font-size:12px;letter-spacing:.06em"></span></div><div class="hud"><button class="btn ghost" id="b-quit" type="button"></button></div></div>

function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function interp(pts,h){for(let i=1;i<pts.length;i++){if(h<=pts[i][0]){const[a,pa]=pts[i-1],[b,pb]=pts[i];return pa+(pb-pa)*(h-a)/(b-a);}}return pts[pts.length-1][1];}

  const r=rng(seed),d=arch.gen(r),price=[],pvF=[],pv=[],loadF=[],load=[];let cl=1;
  let guest=null;if(r()<.35){const a=34+Math.floor(r()*6);guest=[a,a+4+Math.floor(r()*3),.8+r()*.8];d.alerts.push({at:a,kind:'guest'});}
  const lmul=.88+r()*.24;

    const h=i/2+0.25;
    let p=interp(d.price,h);p=p<=0.02?0.01:Math.max(0.01,p*(1+(r()-0.5)*0.06));price.push(Math.round(p*100)/100);
    let k=0;if(h>d.rise&&h<d.set)k=d.peak*Math.pow(Math.sin(Math.PI*(h-d.rise)/(d.set-d.rise)),1.6);
    pvF.push(Math.round(k*(1-(d.cloudy||0)*0.55)*100)/100);
    let a;if(d.cloudy){cl=0.55*cl+0.45*(1-d.cloudy*r()*1.3);a=Math.max(.08,cl);}else a=0.95+r()*0.05;
    d.wx.forEach(([s,e,f])=>{if(h>=s&&h<e)a=Math.min(a,f+r()*0.1);});
    pv.push(Math.round(k*a*100)/100);

function step(mode,s,pv,L,out){
  const roomKW=Math.max(0,(CAP-s)/(EC*DT)),availKW=Math.max(0,s*ED/DT);
  let c=0,d=0,ac=0,clip=0,unmet=0;
  if(out){
    if(pv>=L){c=Math.min(B,roomKW,pv-L);ac=Math.min(P,L);clip=Math.max(0,pv-c-ac);}
    else{d=Math.min(B,availKW,L-pv,Math.max(0,P-pv));ac=pv+d;unmet=Math.max(0,L-ac);}
    return {s2:Math.min(CAP,Math.max(0,s+c*DT*EC-d*DT/ED)),grid:0,clip,unmet,c,d,ac};
  }
  if(mode==='hold'){ac=Math.min(P,pv);clip=pv-ac;}
  else if(mode==='auto'){
    if(pv>=L){c=Math.min(B,roomKW,pv-L);if(pv-c>P)c=Math.max(c,Math.min(B,roomKW,pv-P));ac=Math.min(P,pv-c);clip=Math.max(0,pv-c-ac);}
    else{d=Math.min(B,availKW,L-pv,Math.max(0,P-pv));ac=pv+d;}
  }else if(mode==='charge'){
    const cpv=Math.min(pv,B,roomKW);const pvAC=Math.min(P,pv-cpv);clip=Math.max(0,pv-cpv-pvAC);
    const cg=Math.max(0,Math.min(B-cpv,roomKW-cpv));c=cpv+cg;ac=pvAC-cg;
  }else{
    const pvAC=Math.min(P,pv);clip=pv-pvAC;d=Math.min(B,availKW,P-pvAC);ac=pvAC+d;
  }
  return {s2:Math.min(CAP,Math.max(0,s+c*DT*EC-d*DT/ED)),grid:L-ac,clip,unmet,c,d,ac};
}
function slotCost(r,p){const e=r.grid*DT;return (e>0?e*(p+ADD):e*Math.max(0,p-FEE))+r.unmet*DT*VOLL;}
function endPenalty(s,D){return Math.max(0,S0-s)/EC*(Math.max(...D.price)+ADD);}
function run(D,plan){

  for(let i=0;i<N;i++){const r=step(plan[i],s,D.pv[i],D.load[i],D.out[i]);const c=slotCost(r,D.price[i]);cost+=c;log.push(Object.assign({s:r.s2,cost:c},r));s=r.s2;}
  cost+=endPenalty(s,D);return {cost,log,s};
}
function optimize(D){
  const Q=0.05,M=Math.round(CAP/Q);let V=new Float64Array(M+1);
  for(let k=0;k<=M;k++)V[k]=endPenalty(k*Q,D);
  const pol=[];
  for(let i=N-1;i>=0;i--){
    const nV=new Float64Array(M+1),nP=new Uint8Array(M+1);
    for(let k=0;k<=M;k++){let best=Infinity,ba=0;
      for(let m=0;m<4;m++){const r=step(MODES[m],k*Q,D.pv[i],D.load[i],D.out[i]);const kk=Math.min(M,Math.max(0,Math.round(r.s2/Q)));const v=slotCost(r,D.price[i])+V[kk];if(v<best-1e-9){best=v;ba=m;}}
      nV[k]=best;nP[k]=ba;}
    V=nV;pol[i]=nP;
  }
  let s=S0;const plan=[];
  for(let i=0;i<N;i++){const m=MODES[pol[i][Math.round(s/Q)]];plan.push(m);s=step(m,s,D.pv[i],D.load[i],D.out[i]).s2;}
  return plan;
}

// rival: re-plans every slot using only what the player can see (price, forecasts, announced outages, last slot's PV)
function mpcPlan(D){
  const Q=0.1,M=Math.round(CAP/Q);let s=S0;const plan=[];
  for(let i=0;i<N;i++){
    const ratio=i>0&&D.pvF[i-1]>0.3?Math.min(1.6,Math.max(.15,D.pv[i-1]/D.pvF[i-1])):1;
    const lratio=i>0?Math.min(1.6,Math.max(.6,D.load[i-1]/Math.max(.1,D.loadF[i-1]))):1;
    let V=new Float64Array(M+1);for(let k=0;k<=M;k++)V[k]=endPenalty(k*Q,D);
    let pick=null;
    for(let j=N-1;j>=i;j--){
      const w=Math.pow(.8,j-i+1),outJ=i>=D.outAnn&&D.out[j],pvH=D.pvF[j]*(1+(ratio-1)*w)*(outJ?.5:1),LH=D.loadF[j]*(1+(lratio-1)*Math.pow(.85,j-i+1)),outH=i>=D.outAnn&&D.out[j];
      const nV=new Float64Array(M+1);const nP=j===i?new Uint8Array(M+1):null;
      for(let k=0;k<=M;k++){let best=Infinity,ba=0;
        for(let m=0;m<4;m++){const r=step(MODES[m],k*Q,pvH,LH,outH);const kk=Math.min(M,Math.max(0,Math.round(r.s2/Q)));const v=slotCost(r,D.price[j])+V[kk];if(v<best-1e-9){best=v;ba=m;}}
        nV[k]=best;if(nP)nP[k]=ba;}
      V=nV;if(nP)pick=nP;
    }
    const m=MODES[pick[Math.min(M,Math.round(s/Q))]];plan.push(m);s=step(m,s,D.pv[i],D.load[i],D.out[i]).s2;
  }
  return plan;
}

function advice(i,pr){

let bMode='home',bArea=4,BB=null;
const bDate=di=>{const d=new Date(Date.UTC(2026,3,1)+di*864e5);return d.toISOString().slice(0,10);};
const bMonth=di=>new Date(Date.UTC(2026,3,1)+di*864e5).getUTCMonth()+1;
const bCap=(p,di)=>bMonth(di)<=8?15:10; // t1 cap: assumed same as p1 (game value)
const bVal=(p,ai,k)=>BD[p][ai][k];
function bWin(p,ai,k,bid,cap){const v=bVal(p,ai,k);if(v===-1)return bid<=cap;if(!v)return false;return bid*10<=v+1e-9;}
function bHist(p,ai,di,b){let sh=0,tot=0;const r=[];for(let d=di-28;d<di;d++){const c=bCap(p,d);for(let j=0;j<6;j++){const v=bVal(p,ai,d*48+b*6+j);tot++;if(v===-1)sh++;else r.push(v>0?v/10/c:0);}}return {r:r.sort((x,y)=>x-y),sh,tot};}
const BT_TARGET=[.9,.6,.3];
const qtl=(a,q)=>a[Math.min(a.length-1,Math.max(0,Math.floor(q*(a.length-1))))];
function bSetup(di,ai){
  const m=bMonth(di),season=m>=6&&m<=9?'summer':m>=10?'autumn':'spring',r=rng(di*97+ai*13+7);
  const spec=(season==='summer'?DAYS[1]:DAYS[0]).gen(r);
  const hour=[];for(let h=0;h<24;h++){let p=interp(spec.price,h+.5);p=Math.max(.01,p*(season==='autumn'?1.1:1)*(1+(r()-.5)*.08));hour.push(Math.round(p*100)/100);}
  const spot=[...Array(8)].map((_,b)=>(hour[b*3]+hour[b*3+1]+hour[b*3+2])/3);
  const act=[...Array(8)].map(()=>r()<BS.act?1+Math.floor(r()*3):0);
  const drift=[...Array(8)].map(()=>-.15-r()*.35);
  const P={};['p1','t1'].forEach(p=>{const cap=bCap(p,di);P[p]=[...Array(8)].map((_,b)=>{const H=bHist(p,ai,di,b);
    const pwX=x=>(H.sh+H.r.filter(v=>v>=x-1e-9).length)/H.tot; // x = bid / cap
    const bids=BT_TARGET.map(t=>{let best=.01;for(let x=.01;x<=1.0001;x+=.01)if(pwX(x)>=t)best=x;return Math.max(.1,Math.round(Math.min(1,best)*cap*10)/10);});
    const pw=bids.map(v=>pwX(v/cap));const ns=H.r.length?H.r:[1];
    return {bids,pw,ps:H.sh/H.tot,merged:bids[0]===bids[2],q10:qtl(ns,.1)*cap,q50:qtl(ns,.5)*cap,q90:qtl(ns,.9)*cap,cap};});});
  return {di,ai,season,hour,spot,act,drift,P,area:BD.areas[ai]};
}
// one block on actual outcomes
function bBlock(D,b,o,st,s,known){
  const r={o,st,w:0,bid:0,dkw:0,kwh:0,spot:0,pen:0,actH:0,fail:false,band:false,e:0};
  if(o==='p1'||o==='t1'){
    const pp=D.P[o][b];r.bid=pp.bids[st];
    for(let j=0;j<6;j++)if(bWin(o,D.ai,D.di*48+b*6+j,r.bid,pp.cap))r.w++;
    r.dkw=r.bid*BS.pw*1000*r.w;
    if(o==='p1'&&r.w){if(s<BS.lo||s>BS.hi){r.band=true;r.pen=-1.5*r.dkw;}else s=Math.max(0,Math.min(BS.cap,s+D.drift[b]*r.w/6));}
    if(o==='t1'&&r.w&&D.act[b]){const hrs=Math.min(D.act[b],r.w/2),need=BS.pw*hrs,have=s*BS.eta;r.actH=hrs;
      if(have>=need-1e-9){s-=need/BS.eta;r.kwh=need*1000*D.spot[b];}else{r.fail=true;r.short=(need-have)/need;r.kwh=have*1000*D.spot[b];s=0;r.pen=-1.5*r.dkw*r.short;}}
  }else if(o==='chg'){const e=Math.max(0,Math.min(BS.pw*3,(BS.hi-s)/BS.eta));s=Math.min(BS.hi,s+e*BS.eta);r.e=e;r.spot=-e*1000*D.spot[b];}
  else if(o==='dis'){const e=Math.min(BS.pw*3,s*BS.eta);s-=e/BS.eta;r.e=e;r.spot=e*1000*D.spot[b];}
  r.s=s;r.net=r.dkw+r.kwh+r.spot+r.pen;return r;
}
function bRun(D,plan){let s=BS.s0;const out=[];let tot=0;const parts={p1:0,t1:0,kwh:0,spot:0,pen:0,end:0};
  plan.forEach((x,b)=>{const r=bBlock(D,b,x.o,x.st,s);s=r.s;out.push(r);tot+=r.net;if(x.o==='p1')parts.p1+=r.dkw;if(x.o==='t1')parts.t1+=r.dkw;parts.kwh+=r.kwh;parts.spot+=r.spot;parts.pen+=r.pen;});
  const avgH=D.hour.reduce((a,b)=>a+b,0)/24,end=Math.max(0,BS.s0-s)/BS.eta*1000*avgH;parts.end=-end;tot-=end;return {tot,parts,res:out,s};}
// DP planner. mode 'exp' uses past distribution + activation probability; 'perfect' uses actual outcomes
function bPlan(D,mode){
  const Q=.25,M=Math.round(BS.cap/Q),acts=[];BOPT.forEach(o=>{if(o==='p1'||o==='t1')[0,1,2].forEach(st=>acts.push({o,st}));else acts.push({o,st:1});});
  let V=new Float64Array(M+1);const avgH=D.hour.reduce((a,b)=>a+b,0)/24;for(let k=0;k<=M;k++)V[k]=-Math.max(0,BS.s0-k*Q)/BS.eta*1000*avgH;
  const pol=[];const vAt=s=>V[Math.min(M,Math.max(0,Math.round(s/Q)))];
  for(let b=7;b>=0;b--){const nV=new Float64Array(M+1),nP=new Array(M+1);
    for(let k=0;k<=M;k++){const s=k*Q;let best=-Infinity,ba=null;
      acts.forEach(a=>{let v;
        if(mode==='perfect'||a.o==='chg'||a.o==='dis'||a.o==='idle'){const r=bBlock(D,b,a.o,a.st,s);v=r.net+vAt(r.s);}
        else{const pp=D.P[a.o][b],bid=pp.bids[a.st],pw=pp.pw[a.st],dkw=bid*BS.pw*1000*6*pw;
          if(a.o==='p1'){if(s<BS.lo||s>BS.hi)v=-0.5*dkw*0+(-1.5*dkw)*1+vAt(s);else v=dkw+vAt(s-.25*pw);}
          else{v=(1-BS.act*pw)*(dkw+vAt(s));[1,2,3].forEach(h=>{const need=BS.pw*h,pr=BS.act*pw/3;if(s*BS.eta>=need)v+=pr*(dkw+need*1000*D.spot[b]+vAt(s-need/BS.eta));else{const sh=(need-s*BS.eta)/need;v+=pr*(dkw*(1-1.5*sh)+s*BS.eta*1000*D.spot[b]+vAt(0));}});}}
        if(v>best+1e-6){best=v;ba=a;}});
      nV[k]=best;nP[k]=ba;}
    V=nV;pol[b]=nP;}
  const plan=[];let s=BS.s0;for(let b=0;b<8;b++){const a=pol[b][Math.min(M,Math.round(s/Q))];plan.push({o:a.o,st:a.st});
    if(mode==='perfect')s=bBlock(D,b,a.o,a.st,s).s;else{const r=bBlock(D,b,a.o,a.st,s);s=r.s;}}
  return plan;
}
// expected activation of 3차①: 35% × 1~3h, deliver what is in the battery, proportional penalty — returns extra value and expected SOC after
function t1Exp(D,b,st,s){const pp=D.P.t1[b],pw=pp.pw[st],dkw=pp.bids[st]*BS.pw*1000*6*pw;let v=0,drain=0;
  [1,2,3].forEach(h=>{const need=BS.pw*h,have=s*BS.eta,pr=BS.act*pw/3;if(have>=need){v+=pr*need*1000*D.spot[b];drain+=pr*need/BS.eta;}else{v+=pr*(have*1000*D.spot[b]-1.5*dkw*(need-have)/need);drain+=pr*s;}});
  return {v,s:Math.max(0,s-drain)};}
function bExpected(D,plan){ // expected value shown while planning (past distribution)
  let s=BS.s0,v=0;plan.forEach((x,b)=>{if(x.o==='p1'||x.o==='t1'){const pp=D.P[x.o][b];v+=pp.bids[x.st]*BS.pw*1000*6*pp.pw[x.st];if(x.o==='p1'&&(s<BS.lo||s>BS.hi))v-=pp.bids[x.st]*BS.pw*1000*6*pp.pw[x.st]*1.5;if(x.o==='t1'){const e=t1Exp(D,b,x.st,s);v+=e.v;s=e.s;}}
    else{const r=bBlock(D,b,x.o,x.st,s);v+=r.net;s=r.s;}if(x.o==='p1')s=Math.max(0,s-.25);});
  v-=Math.max(0,BS.s0-s)/BS.eta*1000*D.hour.reduce((a,b)=>a+b,0)/24;return v;}

const man=v=>{const a=Math.abs(v);const s=a>=10000?(Math.round(a/1000)/10).toFixed(1)+(lang==='ko'?'만':'万'):Math.round(a).toLocaleString();return (v<0?'−':'')+'¥'+s;};
function bStart(di){
  const ai=bArea;if(di==null)di=28+Math.floor(Math.random()*(BDAYS-28));
  const D=bSetup(di,ai);BB={D,plan:[...Array(8)].map(()=>({o:'idle',st:1})),phase:'bid'};
  BB.mpc=bPlan(D,'exp');BB.ai=bPlan(D,'perfect');
  document.body.classList.add('playing');$('lobby').hidden=true;$('play').hidden=true;$('bess').hidden=false;$('modal').hidden=true;window.scrollTo(0,0);
  bRender();beep(660,.12);
}
function bSim(plan){let s=BS.s0;return plan.map((x,b)=>{if(x.o==='p1')s=Math.max(0,s-.25);else if(x.o==='t1')s=t1Exp(BB.D,b,x.st,s).s;else s=bBlock(BB.D,b,x.o,x.st,s).s;return s;});}
function bRender(){
  const t=BT[lang],D=BB.D;
  $('b-hdr').textContent=t.hdr(AREA[lang][D.area],t.season[D.season]);$('b-quit').textContent=t.lobby;
  $('b-pk').textContent=t.pk;$('b-anc').textContent=t.anc;$('b-clr').textContent=t.clr;$('b-submit').textContent=t.submit;
  const box=$('b-cards');box.innerHTML='';
  BB.plan.forEach((x,b)=>{const c=document.createElement('div');c.className='bcard';c.id='bc-'+b;c.style.setProperty('--c',BCOL[x.o]);
    const anc=x.o==='p1'||x.o==='t1';
    c.innerHTML=`<div class="bt mono">${String(b*3).padStart(2,'0')}–${String(b*3+3).padStart(2,'0')}</div>
      <select id="bo-${b}" aria-label="use">${BOPT.map(o=>`<option value="${o}"${o===x.o?' selected':''}>${t.opt[o]}</option>`).join('')}</select>
      <select id="bs-${b}" aria-label="bid"${anc?'':' disabled'}>${anc?(D.P[x.o][b].merged?`<option value="0" selected>${t.capBid(D.P[x.o][b].bids[0].toFixed(1),Math.round(D.P[x.o][b].ps*100))}</option>`:D.P[x.o][b].bids.map((v,i)=>`<option value="${i}"${i===x.st?' selected':''}>${t.st[i]} ${v.toFixed(1)}円 ${t.pw(Math.round(D.P[x.o][b].pw[i]*100))}</option>`).join('')):`<option>—</option>`}</select>
      <div class="bres" id="br-${b}"></div>`;
    box.appendChild(c);
    c.querySelector('#bo-'+b).onchange=e=>{if(BB.phase!=='bid')return;x.o=e.target.value;if((x.o==='p1'||x.o==='t1')&&D.P[x.o][b].merged)x.st=0;bRender();};
    c.querySelector('#bs-'+b).onchange=e=>{if(BB.phase!=='bid')return;x.st=+e.target.value;bRender();};
  });
  if(BB.phase==='bid')$('b-exp').textContent=t.exp(man(bExpected(D,BB.plan)));
  bDraw();
}
function bDraw(){
  const t=BT[lang],D=BB.D,svg=$('b-chart'),L0=46,NR=window.innerWidth<=480,VW=NR?400:640,AO=NR?16:0,SO=NR?32:0,W=VW-L0-8,BW=W/8,mono='font-family="IBM Plex Mono, ui-monospace, Menlo, monospace"';
  svg.setAttribute('viewBox',`0 0 ${VW} ${300+SO}`);
  let h='';
  for(let b=0;b<=8;b++){const x=L0+b*BW;h+=`<line x1="${x}" x2="${x}" y1="8" y2="${282+SO}" stroke="#1C3A48"/>`;if(b<8)h+=`<text x="${x+BW/2}" y="${296+SO}" fill="#8FA8B3" font-size="12" text-anchor="middle" ${mono}>${b*3}–${b*3+3}</text>`;}
  // spot
  const smx=Math.max(...D.hour)*1.1,sy=v=>84-v/smx*70;
  h+=`<text x="${L0+4}" y="20" fill="#8FA8B3" font-size="11">${t.axSpot}</text><text x="${L0-4}" y="${sy(smx/1.1)+4}" fill="#8FA8B3" font-size="11" text-anchor="end" ${mono}>${Math.round(smx/1.1)}</text><text x="${L0-4}" y="88" fill="#8FA8B3" font-size="11" text-anchor="end" ${mono}>0</text>`;
  D.spot.forEach((v,b)=>{h+=`<rect x="${L0+b*BW+4}" y="${sy(v)}" width="${BW-8}" height="${84-sy(v)}" fill="#7FA2FF" opacity=".22" rx="2"/>`;});
  h+=`<path d="${D.hour.map((v,i)=>(i?'L':'M')+(L0+(i+.5)*W/24)+' '+sy(v)).join('')}" fill="none" stroke="#7FA2FF" stroke-width="2"/>`;
  // ancillary distributions
  const amx=D.P.p1[0].cap*1.05,ay=v=>184+AO-Math.min(v,amx)/amx*70,axAnc=NR?t.axAnc.replace(/\s?[(（][^)）]*[)）]\s?/,' ').replace(/\s+·\s+/g,' · '):t.axAnc;
  h+=`<text x="${L0+4}" y="${NR?110:104}" fill="#8FA8B3" font-size="${NR?10:11}">${axAnc}</text><text x="${L0-4}" y="${ay(amx/1.05)+4}" fill="#8FA8B3" font-size="11" text-anchor="end" ${mono}>${Math.round(amx/1.05)}</text><text x="${L0-4}" y="${188+AO}" fill="#8FA8B3" font-size="11" text-anchor="end" ${mono}>0</text>`;
  ['p1','t1'].forEach((p,pi)=>D.P[p].forEach((pp,b)=>{const x=L0+b*BW+8+pi*(BW-16)/2,w=(BW-16)/2-4;
    h+=`<line x1="${x+w/2}" x2="${x+w/2}" y1="${ay(pp.q90)}" y2="${ay(pp.q10)}" stroke="${BCOL[p]}" stroke-opacity=".7"/><rect x="${x}" y="${ay(Math.max(pp.q50,pp.q10))-3}" width="${w}" height="6" rx="2" fill="${BCOL[p]}" opacity=".85"/>`;
    if(pp.ps>=.05)h+=`<text x="${x+w/2}" y="${ay(amx/1.05)-4-(NR&&pi?9:0)}" fill="${BCOL[p]}" font-size="${NR?8.5:9.5}" text-anchor="middle" ${mono}>${Math.round(pp.ps*100)}%</text>`;
    const x0=BB.plan[b];if(x0.o===p)h+=`<path d="M${x+w/2} ${ay(pp.bids[x0.st])-6}l6 6l-6 6l-6-6z" fill="#F5B841" stroke="#0A1820"/>`;
    if(BB.phase!=='bid'){const vs=[];for(let j=0;j<6;j++){const v=bVal(p,D.ai,D.di*48+b*6+j);vs.push(v===-1?pp.cap:v/10);}vs.forEach((v,j)=>h+=`<circle cx="${x+2+j*(w-4)/5}" cy="${ay(v)}" r="2.2" fill="#E8F1F4"/>`);}
  }));
  const LY=NR?196+SO:96;
  h+=`<rect x="${L0+W-150}" y="${LY}" width="10" height="10" fill="${BCOL.p1}"/><text x="${L0+W-136}" y="${LY+9}" fill="#E8F1F4" font-size="11">${t.opt.p1}</text><rect x="${L0+W-70}" y="${LY}" width="10" height="10" fill="${BCOL.t1}"/><text x="${L0+W-56}" y="${LY+9}" fill="#E8F1F4" font-size="11">${t.opt.t1}</text>`;
  // SOC
  const qy=v=>272+SO-v/BS.cap*66;
  h+=`<rect x="${L0}" y="${qy(BS.hi)}" width="${W}" height="${qy(BS.lo)-qy(BS.hi)}" fill="${BCOL.p1}" opacity=".08"/><text x="${L0+4}" y="${204+SO}" fill="#8FA8B3" font-size="11">${t.axSoc}</text><text x="${L0-4}" y="${qy(8)+4}" fill="#8FA8B3" font-size="11" text-anchor="end" ${mono}>8</text><text x="${L0-4}" y="${qy(0)+4}" fill="#8FA8B3" font-size="11" text-anchor="end" ${mono}>0</text>`;
  BB.plan.forEach((x,b)=>h+=`<rect x="${L0+b*BW+2}" y="${276+SO}" width="${BW-4}" height="6" rx="2" fill="${BCOL[x.o]}"/>`);
  const soc=BB.phase==='bid'?bSim(BB.plan):BB.run.res.map(r=>r.s);const upto=BB.phase==='bid'?8:(BB.shown||0);
  let d=`M${L0} ${qy(BS.s0)}`;soc.slice(0,upto).forEach((v,b)=>d+=`L${L0+(b+1)*BW} ${qy(v)}`);
  h+=`<path d="${d}" fill="none" stroke="#3CC6B4" stroke-width="2.4" ${BB.phase==='bid'?'stroke-dasharray="5 4"':''}/>`;
  svg.innerHTML=h;
}
function bPreset(k){if(BB.phase!=='bid')return;const D=BB.D;
  if(k==='clr')BB.plan=BB.plan.map(()=>({o:'idle',st:1}));
  else if(k==='anc')BB.plan=BB.plan.map(()=>({o:'p1',st:1}));
  else{const idx=D.spot.map((v,b)=>[v,b]).sort((a,c)=>a[0]-c[0]);const lo=idx.slice(0,2).map(x=>x[1]),hi=idx.slice(-2).map(x=>x[1]);
    BB.plan=BB.plan.map((_,b)=>({o:lo.includes(b)?'chg':hi.includes(b)?'dis':'idle',st:1}));}
  bRender();}
function bSubmit(){
  if(BB.phase!=='bid')return;BB.phase='reveal';BB.run=bRun(BB.D,BB.plan);BB.shown=0;
  document.querySelectorAll('#b-cards select').forEach(s=>s.disabled=true);$('b-submit').disabled=true;$('b-exp').textContent='';
  const t=BT[lang];
  const tick=()=>{const b=BB.shown;if(b>=8){setTimeout(bFinish,600);return;}
    const r=BB.run.res[b],el=$('br-'+b),c=$('bc-'+b);let txt='',ok=true;
    if(r.o==='p1'||r.o==='t1'){if(r.w){txt=t.won(r.w,man(r.dkw));if(r.band){txt+=' · '+t.band;ok=false;}if(r.actH)txt+=' · '+(r.fail?t.actFail(Math.round(r.short*100)):t.act(r.actH));if(r.fail)ok=false;}else{txt=t.lost;ok=false;}}
    else if(r.o==='chg')txt=t.chg(r.e.toFixed(1),man(r.spot));else if(r.o==='dis')txt=t.dis(r.e.toFixed(1),man(r.spot));else txt=t.idle;
    el.textContent=txt;c.classList.add('flip',ok?'ok':'ng');beep(ok?(r.w?880:600):220,.1,ok?'triangle':'sawtooth',.04);
    BB.shown++;bDraw();setTimeout(tick,520);};
  tick();
}
function bFinish(){
  BB.phase='done';const t=BT[lang].res,D=BB.D,me=BB.run,mp=bRun(D,BB.mpc),ai=bRun(D,BB.ai);
  const eff=mp.tot>0?Math.max(0,me.tot/mp.tot):(me.tot>=mp.tot?1:0),rank=eff>=1?'S':eff>=.9?'A':eff>=.75?'BB':eff>=.55?'C':'D';
  let bidN=0,winN=0;me.res.forEach(r=>{if(r.o==='p1'||r.o==='t1'){bidN+=6;winN+=r.w;}});
  const pen=me.parts.pen<-1;
  const mis=[[t.m1,!pen],[t.m2,eff>=.9],[t.m3,bidN>0&&winN/bidN>=.7]];const stars=mis.filter(m=>m[1]).length;
  let hist2=[];try{hist2=JSON.parse(localStorage.getItem('dispatch4-bess')||'[]')||[];}catch(e){}
  if(!BB.retry){hist2.push(eff);save('dispatch4-bess',hist2.slice(-30));}
  const aggLost=me.res.filter(r=>(r.o==='p1'||r.o==='t1')&&r.st===2&&r.w<=2).length;
  const shortRate=(()=>{let n=0,c=0;for(let k=(D.di-28)*48;k<D.di*48;k++){n++;if(bVal('p1',D.ai,k)===-1)c++;}return c/n;})();
  const consP1=me.res.filter(r=>r.o==='p1'&&r.st===0).length;
  const mergedUsed=BB.plan.filter((x,b)=>(x.o==='p1'||x.o==='t1')&&D.P[x.o][b].merged).length;
  const lesson=pen?t.L.pen:aggLost>=2?t.L.lostAgg(aggLost):(mergedUsed>=2||(shortRate>.5&&consP1>=2))?t.L.short:t.L.gen;
  const rows=[['p1','p1'],['t1','t1'],['kwh','kwh'],['spot','spot'],['pen','pen'],['end','end']].map(([k,l])=>`<tr><td>${t[l]}</td><td>${man(me.parts[k])}</td><td>${man(mp.parts[k])}</td><td>${man(ai.parts[k])}</td></tr>`).join('')+`<tr class="me"><td>${t.tot}</td><td>${man(me.tot)}</td><td>${man(mp.tot)}</td><td>${man(ai.tot)}</td></tr>`;
  const strip=(lab,plan)=>`<div style="display:grid;grid-template-columns:64px repeat(8,1fr);gap:3px;align-items:center"><span style="font-size:12px;color:var(--muted)">${lab}</span>${plan.map(x=>`<span title="${BT[lang].opt[x.o]}" style="height:16px;border-radius:3px;background:${BCOL[x.o]};opacity:${x.o==='p1'||x.o==='t1'?(.55+x.st*.2):1}"></span>`).join('')}</div>`;
  const legend=BOPT.map(o=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12px;color:var(--muted)"><i style="width:10px;height:10px;border-radius:2px;background:${BCOL[o]};display:inline-block"></i>${BT[lang].opt[o]}</span>`).join('');
  $('sheet').innerHTML=`
   <div class="top" style="background-image:url(${IMG.stack});background-position:right center;background-size:contain;background-color:#000"><div class="rank">${rank}</div><div><div class="eyebrow">${t.title}</div><div class="stars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div><div class="mono" style="font-size:15px">${t.eff} ${Math.round(eff*100)}%</div><div style="margin-top:4px;font-weight:700">${t.reveal(bDate(D.di),AREA[lang][D.area])}</div></div></div>
   <div class="body">
    <table class="cmp"><thead><tr><th>${t.item}</th><th>${t.me}</th><th>${t.mpc}</th><th>${t.ai}</th></tr></thead><tbody>${rows}</tbody></table>
    <div><div class="eyebrow" style="margin-bottom:6px">${t.mis}</div><ul class="missions">${mis.map(([l,ok])=>`<li><span class="${ok?'m':'x'}">${ok?'★':'✕'}</span><span>${l}</span></li>`).join('')}</ul></div>
    <div style="display:flex;flex-direction:column;gap:6px"><div class="eyebrow">${t.plan}</div>${strip(t.me,BB.plan)}${strip(t.mpc,BB.mpc)}${strip(t.ai,BB.ai)}<div>${legend}</div></div>
    <p class="lesson"><b style="display:block;color:var(--muted);font-size:12px">${t.lesson}</b>${lesson}</p>
    <div class="row"><button class="btn ghost" id="br-lobby" type="button">${t.lobby}</button><button class="btn" id="br-again" type="button">${t.again}</button><button class="btn primary" id="br-next" type="button">${t.next} →</button></div>
   </div>`;
  $('modal').hidden=false;beep(stars>=2?784:523,.25);setTimeout(()=>beep(stars>=2?1046:440,.3),180);
  $('br-lobby').onclick=toLobby;$('br-again').onclick=()=>{const di=D.di;bStart(di);BB.retry=true;};$('br-next').onclick=()=>bStart();
}
function renderModeSwitch(){
  const t=BT[lang];$('m-home').textContent=t.tab[0];$('m-bess').textContent=t.tab[1];
  $('m-home').setAttribute('aria-pressed',bMode==='home');$('m-bess').setAttribute('aria-pressed',bMode==='bess');
  $('home-lobby').hidden=bMode!=='home';$('bess-lobby').hidden=bMode!=='bess';
  $('bl-title').textContent=t.title;$('bl-desc').textContent=t.desc;$('bl-area').textContent=t.area;$('b-start').textContent=t.start+' →';
  $('bl-how').innerHTML=t.how.map(s=>`<li>${s}</li>`).join('');$('bl-spec').innerHTML=t.spec.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('');
  const at=$('bl-areas');at.innerHTML='';BD.areas.forEach((a,i)=>{const b=document.createElement('button');b.type='button';b.className='tab';b.id='ba-'+i;b.setAttribute('role','tab');b.setAttribute('aria-selected',i===bArea);b.textContent=AREA[lang][a];b.onclick=()=>{bArea=i;renderModeSwitch();};at.appendChild(b);});
  {const arr=BD.p1[bArea];let c=0;arr.forEach(v=>{if(v===-1)c++;});const r=Math.round(c/arr.length*100);$('bl-note').textContent=lang==='ko'?`1차 모집량 미달 코마 ${r}% — ${r>=60?'부족이 심해 상한 근처로 내도 붙는 날이 많습니다 (쉬움)':r>=35?'경쟁과 부족이 섞여 입찰가 판단이 중요합니다':'경쟁이 있어 입찰가와 용도 배분이 승부를 가릅니다 (어려움)'}`:`一次の募集量未達コマ ${r}% — ${r>=60?'不足が大きく上限近くでも落札される日が多い（易）':r>=35?'競争と不足が混在し、入札価格の判断が重要':'競争があり、入札価格と用途配分が勝負（難）'}`;}
  let h2=[];try{h2=JSON.parse(localStorage.getItem('dispatch4-bess')||'[]')||[];}catch(e){}
  const rc=h2.slice(-10);$('bl-avg').textContent=rc.length?(lang==='ko'?`최근 ${rc.length}판 평균: 예보 AI 대비 ${Math.round(rc.reduce((a,b)=>a+b,0)/rc.length*100)}%`:`直近${rc.length}回の平均：予報AI比 ${Math.round(rc.reduce((a,b)=>a+b,0)/rc.length*100)}%`):'';
}
$('m-home').onclick=()=>{bMode='home';renderModeSwitch();};$('m-bess').onclick=()=>{bMode='bess';renderModeSwitch();};
$('b-start').onclick=()=>bStart();$('b-quit').onclick=toLobby;$('b-submit').onclick=bSubmit;
$('b-pk').onclick=()=>bPreset('pk');$('b-anc').onclick=()=>bPreset('anc');$('b-clr').onclick=()=>bPreset('clr');

$('start').onclick=()=>startGame();$('d-start').onclick=()=>startGame({daily:true});$('quit').onclick=toLobby;
$('snd').onclick=()=>{snd=!snd;renderPlayText();};
[0,1,2,4].forEach(k=>$('sp-'+k).onclick=()=>setSpeed(k));
const setLang=l=>{lang=l;try{localStorage.setItem('dispatch-lang',l);}catch(e){}if(G&&!G.done){renderPlayText();renderModes();frame();}else if(!G)renderLobby();if(typeof renderModeSwitch==='function')renderModeSwitch();if(BB&&!$('bess').hidden&&BB.phase==='bid')bRender();};
$('lang-ko').onclick=()=>setLang('ko');$('lang-ja').onclick=()=>setLang('ja');
document.addEventListener('keydown',e=>{if(!G||G.done)return;const k=+e.key;if(k>=1&&k<=4)setMode(MODES[k-1]);if(e.key===' '){e.preventDefault();setSpeed(speed===0?1:0);}});
window.__dispatch={DAYS,PATS,buildDay,run,optimize,step,mpcPlan,bSetup,bPlan,bRun,BS};
renderLobby();renderModeSwitch();
window.addEventListener('resize',()=>{if(BB&&!$('bess').hidden)bDraw();});
})();
